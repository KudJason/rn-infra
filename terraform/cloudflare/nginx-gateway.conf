# Nginx API Gateway 配置
# 用于 api.ruralneighbor.com
# 部署位置: /etc/nginx/sites-available/api-gateway.conf

# Upstream 配置 - 后端微服务
upstream auth_service {
    server localhost:8002;
    keepalive 32;
}

upstream user_service {
    server localhost:8003;
    keepalive 32;
}

upstream request_service {
    server localhost:8001;
    keepalive 32;
}

upstream payment_service {
    server localhost:8005;
    keepalive 32;
}

upstream notification_service {
    server localhost:8006;
    keepalive 32;
}

upstream location_service {
    server localhost:8004;
    keepalive 32;
}

# 日志格式
log_format api_gateway '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

# HTTP 服务器 - 重定向到 HTTPS（Cloudflare 会自动处理，但保留以防直接访问）
server {
    listen 80;
    listen [::]:80;
    server_name api.ruralneighbor.com;

    # 健康检查端点（Cloudflare Flexible 模式走 80）
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
    }

    # 根路径 - API 信息
    location = / {
        default_type application/json;
        return 200 '{"status":"ok","version":"v1","api_base":"/api/v1","endpoints":["/api/v1/auth","/api/v1/users","/api/v1/requests","/api/v1/payments","/api/v1/notifications","/api/v1/locations"]}';
    }

    # 为无尾斜杠的基础路径补齐（避免 404）
    location = /api/v1/auth { return 301 /api/v1/auth/; }
    location = /api/v1/users { return 301 /api/v1/users/; }
    location = /api/v1/requests { return 301 /api/v1/requests/; }
    location = /api/v1/payments { return 301 /api/v1/payments/; }
    location = /api/v1/notifications { return 301 /api/v1/notifications/; }
    location = /api/v1/locations { return 301 /api/v1/locations/; }

    # 使用“带尾斜杠”+“带尾斜杠 proxy_pass”实现前缀剥离
    location /api/v1/auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header X-Service-Name "auth";
    }

    location /api/v1/users/ {
        proxy_pass http://user_service/;
        proxy_set_header X-Service-Name "user";
    }

    location /api/v1/requests/ {
        proxy_pass http://request_service/;
        proxy_set_header X-Service-Name "request";
    }

    location /api/v1/payments/ {
        proxy_pass http://payment_service/;
        proxy_set_header X-Service-Name "payment";
    }

    location /api/v1/notifications/ {
        proxy_pass http://notification_service/;
        proxy_set_header X-Service-Name "notification";
    }

    location /api/v1/locations/ {
        proxy_pass http://location_service/;
        proxy_set_header X-Service-Name "location";
    }

    # 直接访问各服务健康检查（可选）
    location = /health/auth { access_log off; proxy_pass http://auth_service/health; }
    location = /health/user { access_log off; proxy_pass http://user_service/health; }
    location = /health/request { access_log off; proxy_pass http://request_service/health; }

    # 兜底 404
    location / { return 404; }
}

# HTTPS 服务器（可选）
# 说明: 当前使用 Cloudflare Flexible SSL，Cloudflare 与源站走 HTTP:80。
# 如需切换 Full(Strict)，请启用下方 server 块并配置 Origin 证书。
#
