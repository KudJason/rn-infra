name: Lark Notification

on:
  push:
  pull_request:
    types: [opened, closed, synchronize]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Lark Notification
        run: |
          TOKEN=$(curl -s -X POST 'https://open.larksuite.com/open-apis/auth/v3/tenant_access_token/internal' \
            -H 'Content-Type: application/json' \
            -d "{\"app_id\":\"${{ secrets.LARK_APP_ID }}\",\"app_secret\":\"${{ secrets.LARK_APP_SECRET }}\"}" | jq -r '.tenant_access_token')

          # Map repository to display name
          case "${{ github.repository }}" in
            "KudJason/RuralNeighbour") REPO_NAME="RnAppFront" ;;
            "KudJason/RuralNeighbour-Backend") REPO_NAME="RnAppBackend" ;;
            "KudJason/ruralneighbour-k8s") REPO_NAME="RnAppBackend" ;;
            "KudJason/rn-infra") REPO_NAME="RnInfraSetup" ;;
            *) REPO_NAME="${{ github.repository }}" ;;
          esac

          if [ "${{ github.event_name }}" = "push" ]; then
            COMMITS_JSON='${{ toJson(github.event.commits) }}'
            COMMITS_COUNT=$(echo "$COMMITS_JSON" | jq '. | length')
            FIRST_MSG=$(echo "$COMMITS_JSON" | jq -r '.[0].message' | jq -sRs 'split("\n")[0] | split(" ")[0:10] | join(" "')
            TEXT="[$REPO_NAME] push to ${{ github.ref_name }} by ${{ github.actor }}: $FIRST_MSG"
          else
            PR_NUM='${{ github.event.pull_request.number }}'
            PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUM"
            TEXT="[$REPO_NAME] PR #$PR_NUM ${{ github.event.action }} by ${{ github.actor }}: $PR_URL"
          fi

          curl -s -X POST 'https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=chat_id' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"receive_id\":\"${{ secrets.LARK_CHAT_ID }}\",\"msg_type\":\"text\",\"content\":{\"text\":\"$TEXT\"}}"
