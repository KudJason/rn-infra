name: Lark Notification

on:
  push:
  pull_request:
    types: [opened, closed, synchronize]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Lark Notification
        run: |
          TOKEN=$(curl -s -X POST 'https://open.larksuite.com/open-apis/auth/v3/tenant_access_token/internal' \
            -H 'Content-Type: application/json' \
            -d "{\"app_id\":\"${{ secrets.LARK_APP_ID }}\",\"app_secret\":\"${{ secrets.LARK_APP_SECRET }}\"}" | jq -r '.tenant_access_token')

          if [ "${{ github.event_name }}" = "push" ]; then
            COMMITS_JSON='${{ toJson(github.event.commits) }}'
            COMMITS_COUNT=$(echo "$COMMITS_JSON" | jq '. | length')
            COMMITS_MSG=$(echo "$COMMITS_JSON" | jq -r '.[] | .message' | head -10 | while IFS= read -r line; do echo "- $line"; done | tr '\n' '|' | sed 's/|/\\n/g' | head -c 500)
            MSG="[${{ github.repository }}] push to ${{ github.ref_name }} by ${{ github.actor }}\nCommits: $COMMITS_COUNT\n$COMMITS_MSG"
          else
            MSG="[${{ github.repository }}] ${{ github.event_name }} by ${{ github.actor }} on ${{ github.base_ref }}"
          fi

          curl -s -X POST 'https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=chat_id' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"receive_id\":\"${{ secrets.LARK_CHAT_ID }}\",\"msg_type\":\"text\",\"content\":\"{\\\"text\\\":\\\"$MSG\\\"}\"}"
